# Record the spoken lines with LICENSED services only and COMMIT them (voice/<lang>/*.mp3 + voice/index.json), then
# re-deploy. voice/config.json decides the service and the voice per language; the free edge-tts voices are never used.
#   Czech:   ElevenLabs, paid plan  → repository secret ELEVENLABS_API_KEY (the whole key sk_…, not its id)
#   English: Azure AI Speech        → repository secret AZURE_SPEECH_KEY + repository variable AZURE_SPEECH_REGION (e.g. westeurope)
# A language whose key is missing records nothing (its current recordings stay); the others still record.
#   - manual: Actions → "Record voices" → Run workflow; "force" re-records a whole language even if nothing changed
#   - automatic when the lines, the data or the voice config change on main
# The last step is the licence audit (make_voice.py --audit): the run stays red while any line is unlicensed.
name: Record voices

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-record even unchanged lines (none = only new, changed or unlicensed lines)'
        type: choice
        options: [none, en, cs, all]
        default: none
  push:
    branches: [main]
    paths:
      - voice/config.json
      - js/phrases.js
      - js/i18n.js
      - data/species.json
      - data/zones.json
      - data/trash.json

permissions:
  contents: write     # commit the recordings
  actions: write      # re-deploy (dispatch pages.yml)

concurrency:
  group: record-voices
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Export the phrase catalogue
        run: node dev/export_phrases.mjs

      - name: Licence audit before recording (what will be recorded and how many characters)
        run: python make_voice.py --audit || true

      - name: Record new, changed and unlicensed lines
        run: |
          rc=0
          case "$FORCE" in
            all)   python make_voice.py --force || rc=1 ;;
            cs|en) python make_voice.py --lang "$FORCE" --force || rc=1
                   python make_voice.py || rc=1 ;;
            *)     python make_voice.py || rc=1 ;;
          esac
          exit $rc
        continue-on-error: true          # a language that fails keeps its current recordings; commit the rest
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || 'none' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}

      - name: Check the recordings before committing
        run: |
          python3 - <<'PY'
          import json, os, sys
          idx = json.load(open("voice/index.json", encoding="utf-8")) if os.path.exists("voice/index.json") else {}
          missing = [e["file"] for lang in idx.values() for e in lang.values() if not os.path.isfile(os.path.join("voice", e["file"]))]
          print(f"index: {sum(len(v) for v in idx.values())} recordings")
          for f in missing: print(f"::error::index.json points to a missing file: {f}")
          sys.exit(1 if missing else 0)
          PY

      - name: Commit the recordings
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          mkdir -p voice/cs voice/en
          git add -f --all voice/cs voice/en
          [ -f voice/index.json ] && git add -f voice/index.json
          if git diff --cached --quiet; then echo "Nothing new to commit."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -q -m "Hlasy: nahrávky v gitu [record-voices]"
          for i in 1 2 3; do
            if git push origin HEAD:main; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            git pull --rebase origin main || { git rebase --abort; exit 1; }
          done
          exit 1

      - name: Re-deploy the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"

      - name: Licence audit (fails while any line is not recorded by a licensed service)
        run: python make_voice.py --audit
